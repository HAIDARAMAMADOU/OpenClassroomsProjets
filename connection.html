<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | Horizon</title>
    <style>
        /* Réinitialisation et styles de base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Conteneur principal du formulaire */
        .login-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        /* En-tête */
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 28px;
            color: #333333;
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 14px;
            color: #666666;
        }

        /* Groupes de champs du formulaire */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #444444;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cccccc;
            border-radius: 6px;
            font-size: 15px;
            color: #333333;
            outline: none;
            transition: border-color 0.3s ease;
        }

        /* Effet au clic sur les champs */
        .form-group input:focus {
            border-color: #ff5a5f;
        }

        /* Options secondaires (Se souvenir de moi / Mot de passe oublié) */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 13px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #555555;
            cursor: pointer;
        }

        .remember-me input {
            cursor: pointer;
        }

        .forgot-password {
            color: #ff5a5f;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        /* Bouton de soumission */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #ff5a5f;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        .btn-submit:hover {
            background-color: #e0484d;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* Lien d'inscription en bas */
        .login-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #666666;
        }

        .login-footer a {
            color: #ff5a5f;
            text-decoration: none;
            font-weight: bold;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h1>Bienvenue</h1>
            <p>Connectez-vous pour accéder à votre espace</p>
        </div>

        <form action="#" method="POST">
            <!-- Champ Email -->
            <div class="form-group">
                <label for="email">Adresse e-mail</label>
                <input type="email" id="email" name="email" placeholder="Votre adresse e-mail" required>
            </div>

            <!-- Champ Mot de passe -->
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" placeholder="Votre mot de passe" required>
            </div>

            <!-- Options : Se souvenir de moi et Mot de passe oublié -->
            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="remember" name="remember"> Se souvenir de moi
                </label>
                <a href="#" class="forgot-password">Mot de passe oublié ?</a>
            </div>

            <!-- Bouton Se connecter -->
            <button type="submit" class="btn-submit">Se connecter</button>
        </form>

        <div class="login-footer">
            <p>Nouveau sur la plateforme ? <a href="inscription.html">Créer un compte</a></p>
        </div>
    </div>

</body>
</html>
