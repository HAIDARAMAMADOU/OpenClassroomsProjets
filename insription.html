<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription | Horizon</title>
    <style>
        /* Réinitialisation et styles de base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Conteneur principal du formulaire */
        .register-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        /* En-tête */
        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-header h1 {
            font-size: 28px;
            color: #333333;
            margin-bottom: 8px;
        }

        .register-header p {
            font-size: 14px;
            color: #666666;
        }

        /* Groupes de champs du formulaire */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #444444;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cccccc;
            border-radius: 6px;
            font-size: 15px;
            color: #333333;
            outline: none;
            transition: border-color 0.3s ease;
        }

        /* Effet au clic sur les champs */
        .form-group input:focus {
            border-color: #ff5a5f;
        }

        /* Case à cocher des conditions */
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 25px;
        }

        .checkbox-group input {
            margin-top: 3px;
            cursor: pointer;
        }

        .checkbox-group label {
            font-size: 13px;
            color: #555555;
            line-height: 1.4;
            cursor: pointer;
        }

        .checkbox-group a {
            color: #ff5a5f;
            text-decoration: none;
            font-weight: 500;
        }

        .checkbox-group a:hover {
            text-decoration: underline;
        }

        /* Bouton de soumission */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #ff5a5f;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        .btn-submit:hover {
            background-color: #e0484d;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* Lien de connexion en bas */
        .register-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #666666;
        }

        .register-footer a {
            color: #ff5a5f;
            text-decoration: none;
            font-weight: bold;
        }

        .register-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="register-container">
        <div class="register-header">
            <h1>Créer un compte</h1>
            <p>Rejoignez-nous dès aujourd'hui en remplissant ce formulaire</p>
        </div>

        <form action="#" method="POST">
            <!-- Champ Nom Complet -->
            <div class="form-group">
                <label for="fullname">Nom complet</label>
                <input type="text" id="fullname" name="fullname" placeholder="Ex: Mamadou Haidara" required>
            </div>

            <!-- Champ Email -->
            <div class="form-group">
                <label for="email">Adresse e-mail</label>
                <input type="email" id="email" name="email" placeholder="Ex: exemple@mail.com" required>
            </div>

            <!-- Champ Mot de passe -->
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" placeholder="Au moins 8 caractères" required>
            </div>

            <!-- Validation des conditions -->
            <div class="checkbox-group">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">J'accepte les <a href="#">Conditions d'utilisation</a> et la <a href="#">Politique de confidentialité</a> de la plateforme.</label>
            </div>

            <!-- Bouton S'inscrire -->
            <button type="submit" class="btn-submit">S'inscrire</button>
        </form>

        <div class="register-footer">
            <p>Vous avez déjà un compte ? <a href="#">Connectez-vous</a></p>
        </div>
    </div>

</body>
</html>
